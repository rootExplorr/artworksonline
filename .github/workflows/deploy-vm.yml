name: Deploy to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: artonline
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:test-password@127.0.0.1:3306/artonline
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test -- --watch=false --browsers=ChromeHeadless

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" \
            'cd /opt/artworksonline && git pull --ff-only && cd deploy && docker compose --env-file .env up -d --build'

      - name: Check production health
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "$SITE_URL/api/health"
